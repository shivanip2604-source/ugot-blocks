<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My portfolio | AIA UGOT</title><link rel="stylesheet" href="assets/site.css">
<style>
.pv h2{border-bottom:3px solid #e8622c;padding-bottom:4px;margin-top:28px}.pv h3{margin:18px 0 4px;color:#0f2a43}
.pv .en{border:1px solid #d6dee6;border-radius:10px;padding:10px 14px;margin:8px 0;background:#fff;break-inside:avoid}.pv .m{font-size:.8rem;color:#5b6b7a}.pv p.t{white-space:pre-wrap;margin:6px 0}
.pv .g{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}.pv .g img{width:100%;border-radius:8px;border:1px solid #cfd8e1}.pv .g figcaption{font-size:.8rem;color:#5b6b7a}.pv figure{margin:0}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.bar button,.bar a{background:#0f2a43;color:#fff;border:0;border-radius:8px;padding:8px 16px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}
@media print{.topbar,.loginbar,.bar,footer,.hero .tag{display:none!important}body{background:#fff}.hero{background:none!important;color:#000!important;padding:0!important}}
</style></head><body>
<div class="topbar"><a class="brand" href="index.html">🤖 AIA · UGOT</a><a class="tab" href="index.html">Home</a><a class="tab" href="criteria-a.html">Criteria A</a><a class="tab" href="criteria-b.html">Criteria B</a><a class="tab" href="criteria-c.html">Criteria C</a><a class="tab" href="criteria-d.html">Criteria D</a></div>
<header class="hero"><span class="tag">MYP Design</span><h1>My portfolio</h1><p id="who">Log in to see your portfolio.</p></header>
<div class="loginbar" id="loginbar"><span>👋 Enter your name and class:</span><input id="loginName" type="text" placeholder="Your name" autocomplete="off"><input id="loginClass" type="text" placeholder="Class (e.g. 10B)" autocomplete="off"><button onclick="doLogin()">Start / Log in</button></div>
<main class="pv"><div class="bar"><button onclick="window.print()">🖨️ Print / save as PDF</button><a href="criteria-a.html">Back to Criteria A</a><a href="criteria-b.html">B</a><a href="criteria-c.html">C</a><a href="criteria-d.html">D</a></div><div id="out"></div></main>
<footer><p>AIA Grade 10 Digital Design &amp; IB MYP Computer Science · UGOT AI Robotics</p></footer>
<script src="assets/config.js"></script><script>window.LESSON={name:"My portfolio",quiz:[]};</script><script src="assets/site.js"></script><script src="assets/topics.js"></script>
<script>
(async function(){
 const u=currentUser();if(!u){return}
 document.getElementById("who").textContent=u.name+" · "+u.klass;
 const key=u.name.trim().toLowerCase()+"|"+u.klass.trim().toLowerCase();
 let all=[];
 try{all=await new Promise(res=>{const rq=indexedDB.open("ugot_portfolio",1);rq.onupgradeneeded=()=>rq.result.createObjectStore("entries",{keyPath:"id"});rq.onsuccess=()=>{const r=rq.result.transaction("entries").objectStore("entries").getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>res([])};rq.onerror=()=>res([])})}catch(e){}
 all=all.filter(e=>e.owner===key&&!e.deletedLocal);
 if(hasUrl()){try{const j=await (await fetch(APPS_SCRIPT_URL+"?action=portfolio&name="+encodeURIComponent(u.name)+"&klass="+encodeURIComponent(u.klass))).json();
   if(j.ok){const have=new Set(all.map(e=>e.id));j.rows.forEach(m=>{if(!have.has(m.id))all.push({id:m.id,criterion:m.criterion,strand:m.strand,topic:m.topic,topicLabel:true,text:m.text,updated:m.updated,images:(m.images||[]).map(x=>({fileId:x.id,name:x.name,caption:x.caption}))})})}}catch(e){}}
 const label=c=>{if(!c)return"";const t=UGOT_TOPICS.find(x=>x[0]===c||x[1]===c);return t?t[1]:c};
 const NAMES={A:"Criterion A · Investigating",B:"Criterion B · Developing ideas",C:"Criterion C · Creating the solution",D:"Criterion D · Evaluating"};
 const src=im=>im.dataUrl||(im.fileId?"https://drive.google.com/thumbnail?id="+im.fileId+"&sz=w1200":"");
 let h="";
 for(const c of "ABCD"){const es=all.filter(e=>e.criterion===c);h+="<h2>"+NAMES[c]+"</h2>";if(!es.length){h+="<p>No work added yet.</p>";continue}
  for(const s of [...new Set(es.map(e=>e.strand))].sort()){h+="<h3>"+escapeHtml(s)+"</h3>";
   es.filter(e=>e.strand===s).sort((a,b)=>(a.updated||"").localeCompare(b.updated||"")).forEach(e=>{h+='<div class="en"><div class="m">'+escapeHtml(new Date(e.updated||Date.now()).toLocaleDateString())+" · "+escapeHtml(label(e.topic))+"</div>"+(e.text?'<p class="t">'+escapeHtml(e.text)+"</p>":"")+((e.images||[]).length?'<div class="g">'+e.images.map(im=>'<figure><img src="'+escapeHtml(src(im))+'" alt="">'+(im.caption?"<figcaption>"+escapeHtml(im.caption)+"</figcaption>":"")+"</figure>").join("")+"</div>":"")+"</div>"})}}
 document.getElementById("out").innerHTML=h;
})();
</script></body></html>
