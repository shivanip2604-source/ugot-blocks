<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 672" width="620" height="672" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"><rect width="620" height="672" fill="#ffffff"/><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#5b6672"/></marker></defs><rect x="240" y="17" width="120" height="34" rx="17" fill="#0f2a43"/><text x="300" y="38.9" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Start</text><rect x="150" y="102.0" width="300" height="58" rx="6" fill="#fff" stroke="#0f2a43" stroke-width="2"/><text x="300" y="127.2" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1b232c">Switch to plate</text><text x="300" y="144.2" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1b232c">recognition</text><rect x="150" y="194.0" width="300" height="46" rx="6" fill="#fff" stroke="#0f2a43" stroke-width="2"/><text x="300" y="221.7" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1b232c">Read the plate results</text><polygon points="300,274.0 460,317.0 300,360.0 140,317.0" fill="#fff3e0" stroke="#e8622c" stroke-width="2"/><text x="300" y="313.1" text-anchor="middle" font-size="13" font-weight="700" fill="#1b232c">Plate D12345 in</text><text x="300" y="330.1" text-anchor="middle" font-size="13" font-weight="700" fill="#1b232c">results?</text><polygon points="300,394.0 460,437.0 300,480.0 140,437.0" fill="#fff3e0" stroke="#e8622c" stroke-width="2"/><text x="300" y="433.1" text-anchor="middle" font-size="13" font-weight="700" fill="#1b232c">210 ≤ X ≤ 430</text><text x="300" y="450.1" text-anchor="middle" font-size="13" font-weight="700" fill="#1b232c">(centred)?</text><rect x="150" y="514.0" width="300" height="46" rx="6" fill="#fff" stroke="#0f2a43" stroke-width="2"/><text x="300" y="541.7" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1b232c">Stop and light green</text><rect x="240" y="594" width="120" height="34" rx="17" fill="#0f2a43"/><text x="300" y="615.9" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">End</text><line x1="300" y1="51.0" x2="300" y2="102.0" stroke="#5b6672" stroke-width="2" marker-end="url(#a)"/><line x1="300" y1="160.0" x2="300" y2="194.0" stroke="#5b6672" stroke-width="2" marker-end="url(#a)"/><line x1="300" y1="240.0" x2="300" y2="274.0" stroke="#5b6672" stroke-width="2" marker-end="url(#a)"/><line x1="300" y1="360.0" x2="300" y2="394.0" stroke="#5b6672" stroke-width="2" marker-end="url(#a)"/><text x="308" y="374.0" font-size="12" font-weight="700" fill="#2e7d32">Yes</text><line x1="300" y1="480.0" x2="300" y2="514.0" stroke="#5b6672" stroke-width="2" marker-end="url(#a)"/><text x="308" y="494.0" font-size="12" font-weight="700" fill="#2e7d32">Yes</text><line x1="300" y1="560.0" x2="300" y2="594.0" stroke="#5b6672" stroke-width="2" marker-end="url(#a)"/><path d="M140,317.0 L52,317.0 L52,217.0 L150,217.0" fill="none" stroke="#5b6672" stroke-width="2" marker-end="url(#a)"/><text x="56" y="311.0" font-size="11.5" font-weight="700" fill="#b71c1c">No: flash red, rotate 5°</text><path d="M140,437.0 L28,437.0 L28,217.0 L150,217.0" fill="none" stroke="#5b6672" stroke-width="2" marker-end="url(#a)"/><text x="32" y="431.0" font-size="11.5" font-weight="700" fill="#b71c1c">No: shift sideways</text></svg>