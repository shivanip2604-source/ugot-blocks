<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 776" width="620" height="776" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"><rect width="620" height="776" fill="#ffffff"/><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#5b6672"/></marker></defs><rect x="240" y="17" width="120" height="34" rx="17" fill="#0f2a43"/><text x="300" y="38.9" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Start</text><rect x="150" y="102.0" width="300" height="58" rx="6" fill="#fff" stroke="#0f2a43" stroke-width="2"/><text x="300" y="127.2" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1b232c">Switch sound localisation</text><text x="300" y="144.2" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1b232c">on</text><rect x="150" y="194.0" width="300" height="58" rx="6" fill="#fff" stroke="#0f2a43" stroke-width="2"/><text x="300" y="219.2" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1b232c">Move towards the side that</text><text x="300" y="236.2" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1b232c">is heard</text><polygon points="300,286.0 460,329.0 300,372.0 140,329.0" fill="#fff3e0" stroke="#e8622c" stroke-width="2"/><text x="300" y="333.6" text-anchor="middle" font-size="13" font-weight="700" fill="#1b232c">Loudness ≥ stop value?</text><rect x="150" y="406.0" width="300" height="46" rx="6" fill="#fff" stroke="#0f2a43" stroke-width="2"/><text x="300" y="433.7" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1b232c">Stop and say &quot;Say help&quot;</text><polygon points="300,486.0 460,529.0 300,572.0 140,529.0" fill="#fff3e0" stroke="#e8622c" stroke-width="2"/><text x="300" y="533.5" text-anchor="middle" font-size="13" font-weight="700" fill="#1b232c">Heard &quot;help&quot;?</text><rect x="150" y="606.0" width="300" height="58" rx="6" fill="#fff" stroke="#0f2a43" stroke-width="2"/><text x="300" y="631.2" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1b232c">Start the voice</text><text x="300" y="648.2" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1b232c">conversation</text><rect x="240" y="698" width="120" height="34" rx="17" fill="#0f2a43"/><text x="300" y="719.9" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">End</text><line x1="300" y1="51.0" x2="300" y2="102.0" stroke="#5b6672" stroke-width="2" marker-end="url(#a)"/><line x1="300" y1="160.0" x2="300" y2="194.0" stroke="#5b6672" stroke-width="2" marker-end="url(#a)"/><line x1="300" y1="252.0" x2="300" y2="286.0" stroke="#5b6672" stroke-width="2" marker-end="url(#a)"/><line x1="300" y1="372.0" x2="300" y2="406.0" stroke="#5b6672" stroke-width="2" marker-end="url(#a)"/><text x="308" y="386.0" font-size="12" font-weight="700" fill="#2e7d32">Yes</text><line x1="300" y1="452.0" x2="300" y2="486.0" stroke="#5b6672" stroke-width="2" marker-end="url(#a)"/><line x1="300" y1="572.0" x2="300" y2="606.0" stroke="#5b6672" stroke-width="2" marker-end="url(#a)"/><text x="308" y="586.0" font-size="12" font-weight="700" fill="#2e7d32">Yes</text><line x1="300" y1="664.0" x2="300" y2="698.0" stroke="#5b6672" stroke-width="2" marker-end="url(#a)"/><path d="M140,329.0 L52,329.0 L52,223.0 L150,223.0" fill="none" stroke="#5b6672" stroke-width="2" marker-end="url(#a)"/><text x="56" y="323.0" font-size="11.5" font-weight="700" fill="#b71c1c">No: keep moving</text><path d="M140,529.0 L40,529.0 L40,429.0 L150,429.0" fill="none" stroke="#5b6672" stroke-width="2" marker-end="url(#a)"/><text x="44" y="523.0" font-size="11.5" font-weight="700" fill="#b71c1c">No: listen again</text></svg>