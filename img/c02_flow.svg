<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 684" width="620" height="684" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"><rect width="620" height="684" fill="#ffffff"/><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#5b6672"/></marker></defs><rect x="240" y="17" width="120" height="34" rx="17" fill="#0f2a43"/><text x="300" y="38.9" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Start</text><rect x="150" y="102.0" width="300" height="46" rx="6" fill="#fff" stroke="#0f2a43" stroke-width="2"/><text x="300" y="129.7" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1b232c">Drive forward at speed 30</text><polygon points="300,182.0 460,225.0 300,268.0 140,225.0" fill="#fff3e0" stroke="#e8622c" stroke-width="2"/><text x="300" y="229.6" text-anchor="middle" font-size="13" font-weight="700" fill="#1b232c">Obstacle ≤ 15 cm away?</text><rect x="150" y="302.0" width="300" height="58" rx="6" fill="#fff" stroke="#0f2a43" stroke-width="2"/><text x="300" y="327.2" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1b232c">Stop, raise flipper, drive</text><text x="300" y="344.2" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1b232c">slowly</text><polygon points="300,394.0 460,437.0 300,480.0 140,437.0" fill="#fff3e0" stroke="#e8622c" stroke-width="2"/><text x="300" y="433.1" text-anchor="middle" font-size="13" font-weight="700" fill="#1b232c">Tilt &lt; 35° and step</text><text x="300" y="450.1" text-anchor="middle" font-size="13" font-weight="700" fill="#1b232c">cleared?</text><rect x="150" y="514.0" width="300" height="58" rx="6" fill="#fff" stroke="#0f2a43" stroke-width="2"/><text x="300" y="539.2" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1b232c">Stop, flipper down, log</text><text x="300" y="556.2" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1b232c">result</text><rect x="240" y="606" width="120" height="34" rx="17" fill="#0f2a43"/><text x="300" y="627.9" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">End</text><line x1="300" y1="51.0" x2="300" y2="102.0" stroke="#5b6672" stroke-width="2" marker-end="url(#a)"/><line x1="300" y1="148.0" x2="300" y2="182.0" stroke="#5b6672" stroke-width="2" marker-end="url(#a)"/><line x1="300" y1="268.0" x2="300" y2="302.0" stroke="#5b6672" stroke-width="2" marker-end="url(#a)"/><text x="308" y="282.0" font-size="12" font-weight="700" fill="#2e7d32">Yes</text><line x1="300" y1="360.0" x2="300" y2="394.0" stroke="#5b6672" stroke-width="2" marker-end="url(#a)"/><line x1="300" y1="480.0" x2="300" y2="514.0" stroke="#5b6672" stroke-width="2" marker-end="url(#a)"/><text x="308" y="494.0" font-size="12" font-weight="700" fill="#2e7d32">Yes</text><line x1="300" y1="572.0" x2="300" y2="606.0" stroke="#5b6672" stroke-width="2" marker-end="url(#a)"/><path d="M140,225.0 L40,225.0 L40,125.0 L150,125.0" fill="none" stroke="#5b6672" stroke-width="2" marker-end="url(#a)"/><text x="44" y="219.0" font-size="11.5" font-weight="700" fill="#b71c1c">No: keep driving</text><path d="M140,437.0 L28,437.0 L28,331.0 L150,331.0" fill="none" stroke="#5b6672" stroke-width="2" marker-end="url(#a)"/><text x="32" y="431.0" font-size="11.5" font-weight="700" fill="#b71c1c">No: keep climbing</text></svg>